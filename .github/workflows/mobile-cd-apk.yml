name: Build & Deploy Android APK to AWS S3

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch: # Cho phép bấm nút "Run workflow" thủ công trên GitHub Actions để test bất cứ lúc nào

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build APK and Upload to AWS S3
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 3. Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 4. Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 5. Cache Gradle Dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 6. Install Dependencies
        run: npm ci

      - name: 7. Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean

      - name: 8. Build Android APK (Release)
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 9. Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: 10. Upload APK to AWS S3
        run: |
          # Tìm file APK được tạo ra trong thư mục outputs
          APK_PATH=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          
          if [ -z "$APK_PATH" ]; then
            echo "Error: Không tìm thấy file APK sau khi build!"
            exit 1
          fi

          echo "Tìm thấy file APK tại: $APK_PATH"
          
          VERSIONED_NAME="taxkeep-build-${{ github.run_number }}.apk"
          LATEST_NAME="taxkeep-latest.apk"

          # Upload bản theo số lần build (để lưu lịch sử)
          aws s3 cp "$APK_PATH" "s3://${{ secrets.AWS_S3_BUCKET }}/apks/$VERSIONED_NAME" --content-type "application/vnd.android.package-archive"
          
          # Upload bản 'taxkeep-latest.apk' (để luôn có 1 link tải cố định)
          aws s3 cp "$APK_PATH" "s3://${{ secrets.AWS_S3_BUCKET }}/apks/$LATEST_NAME" --content-type "application/vnd.android.package-archive"

      - name: 11. Output Download URL
        run: |
          echo "=========================================================="
          echo "🎉 APK BUILD & DEPLOY THÀNH CÔNG!"
          echo "Link tải bản mới nhất (taxkeep-latest.apk):"
          echo "https://${{ secrets.AWS_S3_BUCKET }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com/apks/taxkeep-latest.apk"
          echo "Link bản build #${{ github.run_number }}:"
          echo "https://${{ secrets.AWS_S3_BUCKET }}.s3.${{ secrets.AWS_REGION }}.amazonaws.com/apks/taxkeep-build-${{ github.run_number }}.apk"
          echo "=========================================================="

