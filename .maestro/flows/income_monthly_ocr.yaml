# OCR phiếu lương + UI nút/xóa lỗi — sau khi FE đã sửa
# Chạy: maestro test .maestro/flows/income_monthly_ocr.yaml -e TEST_USER_ID=... -e TEST_USER_PASSWORD=...
appId: host.exp.exponent
name: income_monthly_ocr
tags:
  - income
  - monthly
  - ocr
---
- launchApp:
    appId: host.exp.exponent
    clearState: false
    permissions:
      all: allow
# Expo Go home → chọn project FE nếu chưa vào app
- runFlow:
    when:
      visible: "Development servers|Enter URL|Recent history"
    commands:
      - tapOn: "FE"
- openLink: exp://10.0.2.2:8081
- extendedWaitUntil:
    visible: ".*Đăng nhập.*|.*Xin chào.*|.*Trang chủ.*|.*Thu nhập.*|.*CCCD.*"
    timeout: 120000

- runFlow:
    when:
      visible: ".*Đăng nhập.*|.*CCCD.*|.*mật khẩu.*"
    commands:
      - tapOn:
          text: ".*CCCD.*|.*căn cước.*|.*Email.*"
          optional: true
      - eraseText
      - inputText: ${TEST_USER_ID}
      - tapOn:
          text: ".*mật khẩu.*|.*Mật khẩu.*"
          optional: true
      - eraseText
      - inputText: ${TEST_USER_PASSWORD}
      - tapOn: "Đăng nhập"
      - extendedWaitUntil:
          visible: "OK|Xin chào|Trang chủ|Thu nhập|Never"
          timeout: 30000
      - runFlow:
          when:
            visible: "Never|Không bao giờ"
          commands:
            - tapOn: "Never|Không bao giờ"
      - runFlow:
          when:
            visible: "OK"
          commands:
            - tapOn: "OK"

- tapOn:
    id: mainTab_IncomeSourceList
- extendedWaitUntil:
    visible:
      id: incomeView_monthly
    timeout: 20000
- tapOn:
    id: incomeView_monthly
- extendedWaitUntil:
    visible:
      id: monthlyIncomeScroll
    timeout: 15000
- tapOn:
    id: monthlyYear_2026
- waitForAnimationToEnd

# 16 — nút Thêm thu nhập tháng trên 1 dòng
- assertVisible:
    id: addMonthlyIncomeBtn
- takeScreenshot: screenshots/income-monthly/16-add-button

# 17 — Lưu trống → lỗi đỏ; gõ 1 ký tự tổ chức → lỗi chung biến mất
- tapOn:
    id: addMonthlyIncomeBtn
- extendedWaitUntil:
    visible:
      id: incomeFormScroll
    timeout: 15000
- scrollUntilVisible:
    element:
      id: saveMonthlyIncomeBtn
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: saveMonthlyIncomeBtn
- scrollUntilVisible:
    element:
      id: incomeFormError
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 40
- extendedWaitUntil:
    visible:
      id: incomeFormError
    timeout: 8000
- assertVisible: ".*Vui lòng kiểm tra lại.*"
- scrollUntilVisible:
    element:
      id: incomeInput_organizationName
    direction: UP
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: incomeInput_organizationName
- eraseText
- inputText: "A"
# Blur ô tổ chức (tránh hideKeyboard=Back đóng form)
- tapOn:
    id: incomeInput_taxIdNumber
- scrollUntilVisible:
    element:
      id: saveMonthlyIncomeBtn
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 40
- extendedWaitUntil:
    notVisible:
      id: incomeFormError
    timeout: 5000
- takeScreenshot: screenshots/income-monthly/17-error-cleared
- tapOn:
    id: incomeFormBack
- extendedWaitUntil:
    visible:
      id: monthlyIncomeScroll
    timeout: 15000

# Đẩy ảnh vào thư viện
- addMedia:
    - "../assets/income-monthly/payslip.jpg"
    - "../assets/income-monthly/not-payslip.jpg"

# OCR thành công (payslip)
- tapOn:
    id: addMonthlyIncomeBtn
- extendedWaitUntil:
    visible:
      id: scanPayslipLibrary
    timeout: 15000
- tapOn:
    id: scanPayslipLibrary
- extendedWaitUntil:
    visible: ".*Photos.*|.*Gallery.*|.*Thư viện.*|.*Recent.*|.*Pictures.*|.*Download.*|.*payslip.*|.*Screenshots.*"
    timeout: 20000
    optional: true
# Chọn ảnh payslip (ưu tiên tên file; fallback ảnh đầu)
- runFlow:
    when:
      visible: ".*payslip.*"
    commands:
      - tapOn: ".*payslip.*"
- runFlow:
    when:
      notVisible: ".*Đang đọc phiếu lương.*"
    commands:
      - tapOn:
          point: "50%,35%"
          optional: true
- runFlow:
    when:
      visible: ".*Đang đọc phiếu lương.*"
    commands:
      - takeScreenshot: screenshots/income-monthly/10-ocr-loading
- extendedWaitUntil:
    visible:
      id: payslipOcrResult
    timeout: 120000
- takeScreenshot: screenshots/income-monthly/11-ocr-result
- assertVisible: ".*CONG TY TNHH DEMO PAYSLIP OCR.*|.*DEMO PAYSLIP.*"
- assertVisible: ".*0312345678.*"
- assertVisible: ".*25\\.000\\.000.*"
- assertVisible: ".*độ tin cậy.*"
# Mở ảnh đính kèm
- runFlow:
    when:
      visible:
        id: payslipAttachment
    commands:
      - scrollUntilVisible:
          element:
            id: payslipAttachment
          direction: DOWN
          timeout: 8000
          visibilityPercentage: 40
      - tapOn:
          id: payslipAttachment
      - waitForAnimationToEnd:
          timeout: 4000
      - back
- scrollUntilVisible:
    element:
      id: saveMonthlyIncomeBtn
    direction: DOWN
    timeout: 10000
    visibilityPercentage: 50
- tapOn:
    id: saveMonthlyIncomeBtn
- extendedWaitUntil:
    visible:
      id: monthlyIncomeScroll
    timeout: 30000
- assertVisible: ".*DEMO PAYSLIP.*|.*0312345678.*"
- takeScreenshot: screenshots/income-monthly/12-list-after-ocr

# Xóa tháng OCR vừa tạo
- runFlow:
    when:
      visible: ".*DEMO PAYSLIP.*|.*0312345678.*"
    commands:
      - tapOn: ".*DEMO PAYSLIP.*|.*0312345678.*"
      - extendedWaitUntil:
          visible: ".*T3.*|.*T.*"
          timeout: 8000
      - tapOn: ".*T3.*|.*T0?3.*"
      - extendedWaitUntil:
          visible:
            id: deleteMonthlyIncomeBtn
          timeout: 10000
      - scrollUntilVisible:
          element:
            id: deleteMonthlyIncomeBtn
          direction: DOWN
          timeout: 8000
          visibilityPercentage: 50
      - tapOn:
          id: deleteMonthlyIncomeBtn
      - tapOn: "Xóa"
      - extendedWaitUntil:
          visible:
            id: monthlyIncomeScroll
          timeout: 20000

# OCR lỗi — ảnh không phải phiếu lương
- addMedia:
    - "../assets/income-monthly/not-payslip.jpg"
- tapOn:
    id: addMonthlyIncomeBtn
- extendedWaitUntil:
    visible:
      id: scanPayslipLibrary
    timeout: 15000
- tapOn:
    id: scanPayslipLibrary
- extendedWaitUntil:
    visible: ".*Photos.*|.*Gallery.*|.*Thư viện.*|.*Recent.*|.*not-payslip.*|.*Download.*"
    timeout: 20000
    optional: true
- runFlow:
    when:
      visible: ".*not-payslip.*"
    commands:
      - tapOn: ".*not-payslip.*"
- runFlow:
    when:
      notVisible:
        id: incomeFormError
    commands:
      - tapOn:
          point: "50%,40%"
          optional: true
- extendedWaitUntil:
    visible:
      id: incomeFormError
    timeout: 120000
- takeScreenshot: screenshots/income-monthly/13-ocr-error
- copyTextFrom:
    id: incomeFormError
- tapOn:
    id: incomeFormBack
    optional: true
- extendedWaitUntil:
    visible:
      id: monthlyIncomeScroll
    timeout: 20000
    optional: true
