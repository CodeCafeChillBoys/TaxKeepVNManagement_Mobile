# TC1 – Upload LECH.png, nhập lệch số, kỳ vọng voucherMismatch (2 dòng TN+thuế)
appId: host.exp.exponent
name: withholding_r2_tc1_lech
---
- tapOn:
    id: mainTab_IncomeSourceList
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    id: incomeView_yearly
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: uploadWithholdingVoucherBtn
- extendedWaitUntil:
    visible:
      id: voucherYear_2025
    timeout: 10000
- tapOn:
    id: voucherYear_2025
- tapOn:
    id: voucherPickLibrary
- waitForAnimationToEnd:
    timeout: 5000
# Chọn ảnh LECH trong picker (point/a11y tùy thiết bị)
- tapOn:
    id: voucherUploadBtn
- extendedWaitUntil:
    visible:
      id: voucherExtractStatus
    timeout: 30000
- tapOn:
    id: voucherInput_companyName
- eraseText: 100
- setClipboard: "CÔNG TY CỔ PHẦN CÔNG NGHỆ FPT"
- pasteText
- tapOn:
    id: voucherInput_totalIncome
- eraseText: 40
- inputText: "290000000"
- tapOn:
    id: voucherInput_taxWithheld
- eraseText: 40
- inputText: "3100000"
- tapOn:
    id: voucherInput_insuranceDeducted
- eraseText: 40
- inputText: "28980000"
- tapOn:
    id: voucherConfirmBtn
- waitForAnimationToEnd:
    timeout: 5000
- assertVisible:
    id: voucherMismatch
