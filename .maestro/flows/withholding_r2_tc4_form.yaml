- tapOn:
    id: voucherInput_companyName
- eraseText: 100
- setClipboard: "CÔNG TY CỔ PHẦN CÔNG NGHỆ FPT"
- pasteText
- tapOn:
    id: voucherInput_totalIncome
- eraseText: 40
- inputText: "1000"
- tapOn:
    id: voucherInput_taxWithheld
- eraseText: 40
- inputText: "2000"
- tapOn:
    id: voucherConfirmBtn
- assertVisible: "Thuế đã khấu trừ không được lớn hơn tổng thu nhập."
