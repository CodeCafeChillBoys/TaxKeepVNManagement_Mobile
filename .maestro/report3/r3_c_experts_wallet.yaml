# Report 3 — Figure 3-15, 3-16, 3-17, 3-25. Tài khoản người nộp thuế (chưa là chuyên gia). Chỉ xem, không đổi dữ liệu.
appId: host.exp.exponent
name: r3_c_experts_wallet
tags:
  - report3
---
- runFlow:
    file: _login.yaml
    env:
      LOGIN_ID: ${TAXPAYER_ID}
      LOGIN_PW: ${TAXPAYER_PW}

# ===== Figure 3-15: Expert Consultation =====
- scrollUntilVisible:
    element:
      id: homeExpertListCard
    direction: DOWN
    timeout: 10000
- tapOn:
    id: homeExpertListCard
- extendedWaitUntil:
    visible: "Tư vấn chuyên gia"
    timeout: 20000
- extendedWaitUntil:
    visible: "Xem & Đặt lịch"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: screenshots/report3/3-15-expert-list

# ===== Figure 3-16: Expert Profile =====
- tapOn:
    text: "Xem & Đặt lịch"
    index: 0
- extendedWaitUntil:
    visible: "Đặt lịch tư vấn|Xác nhận đặt lịch này"
    timeout: 30000
- waitForAnimationToEnd
- takeScreenshot: screenshots/report3/3-16-expert-profile
- back
- back

# ===== Figure 3-17: Tax Expert Application =====
- tapOn:
    id: mainTab_Profile
- scrollUntilVisible:
    element:
      id: quickLinkExpertApplication
    direction: DOWN
    timeout: 10000
- tapOn:
    id: quickLinkExpertApplication
- extendedWaitUntil:
    visible: "Hồ sơ chuyên gia thuế"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: screenshots/report3/3-17-expert-application
- back

# ===== Figure 3-25: TaxKeep Wallet =====
- scrollUntilVisible:
    element:
      id: quickLinkUserWallet
    direction: DOWN
    timeout: 10000
- tapOn:
    id: quickLinkUserWallet
- extendedWaitUntil:
    visible: "Ví điện tử TaxKeepVN"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: screenshots/report3/3-25-wallet
